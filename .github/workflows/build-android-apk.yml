name: build-android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyStockAssistant-v5.0.apk

      - name: Upload MyStockAssistant-v5.0.apk
        uses: actions/upload-artifact@v4
        with:
          name: MyStockAssistant-v5.0-APK
          path: MyStockAssistant-v5.0.apk
          retention-days: 30
