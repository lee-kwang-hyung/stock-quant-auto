name: kis-paper-autotrade

on:
  workflow_dispatch:
  schedule:
    # UTC 00:05~05:35 = 한국시간(KST) 평일 09:05~14:35 (30분 간격)
    - cron: '5,35 0-5 * * 1-5'
    # UTC 06:05, 06:20 = 한국시간(KST) 평일 15:05, 15:20 (장 마감 전 점검)
    - cron: '5,20 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: kis-paper-autotrade
  cancel-in-progress: false

jobs:
  paper-autotrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run KIS Paper Autotrade (Mock Only)
        env:
          TZ: Asia/Seoul
          APP_PIN: ${{ secrets.APP_PIN }}
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT_NO: ${{ secrets.KIS_PAPER_ACCOUNT_NO }}
        run: |
          python scripts/kis_paper_trader.py

      - name: Commit and push paper trade results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # live_feed.json 덮어쓰기 원천 방지
          git checkout -- docs/data/live_feed.json 2>/dev/null || true

          git add data/paper_ledger.json data/paper_trading_summary.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update KIS paper autotrade report [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No paper trade changes to commit."
          fi
