name: weekly-3y-backtest

on:
  schedule:
    # 매주 토요일 오전 10:00 KST (= 토요일 01:00 UTC)
    - cron: "0 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly_backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run 3-year KR/US strategy backtest
        run: |
          python scripts/self_test.py
          python scripts/backtester.py
      - name: Commit backtest summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          git diff --cached --quiet || git commit -m "data: weekly 3y stock backtest report"
          git push
